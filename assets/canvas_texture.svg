<svg xmlns="http://www.w3.org/2000/svg" width="120" height="120" viewBox="0 0 120 120">
  <defs>
    <pattern id="weave" width="8" height="8" patternUnits="userSpaceOnUse">
      <rect width="8" height="8" fill="#f6f0e4"/>
      <!-- Horizontal warp thread -->
      <path d="M0 2h8 M0 6h8" stroke="#ece4d4" stroke-width="1.2" stroke-linecap="round"/>
      <!-- Vertical weft thread -->
      <path d="M2 0v8 M6 0v8" stroke="#e4d9c5" stroke-width="1.2" stroke-linecap="round"/>
      <!-- Thread fiber crossings and tactile grain -->
      <circle cx="2" cy="2" r="0.8" fill="#d8cca8" opacity="0.6"/>
      <circle cx="6" cy="6" r="0.8" fill="#d2c4ae" opacity="0.6"/>
      <circle cx="6" cy="2" r="0.6" fill="#fdfcf8" opacity="0.8"/>
      <circle cx="2" cy="6" r="0.6" fill="#fdfcf8" opacity="0.8"/>
      <path d="M1 1l2 2 M5 5l2 2" stroke="#cfc0a8" stroke-width="0.5" opacity="0.4"/>
    </pattern>
  </defs>
  <rect width="100%" height="100%" fill="url(#weave)"/>
</svg>
